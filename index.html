<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WonderBean — Whimsical Artwork & Creations</title>
  <meta name="description" content="WonderBean — Whimsical art and creations by Wonder Bean. Artwork coming soon!">
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

  <!-- Rainbow Top Banner -->
  <div class="rainbow-strip"></div>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container nav-wrapper">
      <a href="./index.html" class="brand-link" aria-label="WonderBean Home">
        <img src="./assets/images/favicon.svg" alt="WonderBean Logo Icon" class="brand-icon">
        <span class="brand-name">Wonder<span class="highlight">Bean</span></span>
      </a>
      <nav aria-label="Main Navigation">
        <ul class="nav-menu">
          <li><a href="./index.html" class="nav-link active" aria-current="page">Home</a></li>
          <li><a href="./gallery.html" class="nav-link">Gallery</a></li>
          <li><a href="./about.html" class="nav-link">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Hero Content -->
  <main class="main-content">
    <section class="home-hero-section">
      <div class="hero-card">
        <!-- Floating decorative sparkles -->
        <span class="floating-ornament ornament-1" aria-hidden="true">✦</span>
        <span class="floating-ornament ornament-2" aria-hidden="true">★</span>

        <!-- Pill badge -->
        <div class="hero-pill-badge">
          <span>✨ Studio Update</span>
        </div>

        <!-- Bolded Centered Announcement -->
        <div class="hero-announcement-box">
          <h1 class="hero-headline">
            artwork coming soon
          </h1>
          <p class="hero-subtitle">
            Fresh whimsical creations and doodles are currently brewing in the sketchbook.
          </p>
        </div>

        <!-- Instagram Handle Block -->
        <div>
          <a href="https://www.instagram.com/wonderbeandraws" 
             target="_blank" 
             rel="noopener noreferrer" 
             class="instagram-block"
             aria-label="Visit WonderBean on Instagram @wonderbeandraws">
            <span class="instagram-icon-wrapper" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
              </svg>
            </span>
            <span class="instagram-handle">@wonderbeandraws</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container footer-content">
      <!-- 6-Color Dots -->
      <div class="color-dots" aria-hidden="true">
        <span class="dot dot-yellow"></span>
        <span class="dot dot-pink"></span>
        <span class="dot dot-purple"></span>
        <span class="dot dot-green"></span>
        <span class="dot dot-blue"></span>
        <span class="dot dot-red"></span>
      </div>
      <p class="footer-text">
        &copy; 2026 WonderBean • Made with love &amp; cool beans
      </p>
      <ul class="footer-links">
        <li><a href="./index.html" class="footer-link">Home</a></li>
        <li><a href="./gallery.html" class="footer-link">Gallery</a></li>
        <li><a href="./about.html" class="footer-link">About</a></li>
        <li><a href="https://www.instagram.com/wonderbeandraws" target="_blank" rel="noopener noreferrer" class="footer-link">Instagram</a></li>
      </ul>
    </div>
  </footer>

</body>
</html>
