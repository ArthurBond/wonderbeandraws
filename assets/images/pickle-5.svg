<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D283E" />
      <stop offset="100%" stop-color="#4A3E6D" />
    </linearGradient>
    <linearGradient id="pickleGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background: Deep Space Brine -->
  <rect width="400" height="400" rx="28" fill="url(#bgGrad5)" />

  <!-- Stars & Galaxies -->
  <circle cx="80" cy="70" r="3" fill="#FFD166"/>
  <circle cx="330" cy="80" r="2.5" fill="#FFFFFF"/>
  <circle cx="340" cy="190" r="3" fill="#FF8DA1"/>
  <circle cx="60" cy="220" r="2.5" fill="#3A86FF"/>
  <circle cx="100" cy="310" r="2" fill="#FFFFFF"/>
  <polygon points="300,290 304,300 315,302 306,310 308,320 299,314 290,320 292,310 283,302 294,300" fill="#FFD166" opacity="0.8"/>

  <!-- Cosmic Swirl Ring -->
  <ellipse cx="200" cy="210" rx="110" ry="35" fill="none" stroke="#FF8DA1" stroke-width="3" opacity="0.6" transform="rotate(-15 200 210)"/>

  <!-- Floating Space Pickle with Astronaut Helmet -->
  <g transform="rotate(8 200 190)">
    <!-- Pickle Body -->
    <path d="M 185 100 C 225 100, 238 140, 232 205 C 228 250, 222 285, 185 288 C 150 288, 148 250, 152 205 C 158 145, 150 100, 185 100 Z" 
          fill="url(#pickleGrad5)" stroke="#081C15" stroke-width="4"/>

    <!-- Helmet Glass Bubble -->
    <circle cx="192" cy="148" r="48" fill="#3A86FF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 160 135 A 40 40 0 0 1 210 115" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>

    <!-- Eyes (Wonder-filled) -->
    <circle cx="180" cy="150" r="5" fill="#081C15"/>
    <circle cx="205" cy="150" r="5" fill="#081C15"/>
    <circle cx="178" cy="148" r="2" fill="#FFFFFF"/>
    <circle cx="203" cy="148" r="2" fill="#FFFFFF"/>

    <!-- Cheeks -->
    <circle cx="170" cy="158" r="4.5" fill="#EF476F"/>
    <circle cx="215" cy="158" r="4.5" fill="#EF476F"/>

    <!-- Smile :O -->
    <circle cx="192" cy="162" r="3" fill="#081C15"/>
  </g>

  <!-- Artwork Label Plate -->
  <g transform="translate(90, 345)">
    <rect width="220" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="110" y="21" font-family="'Fraunces', Georgia, serif" font-size="13" font-weight="700" fill="#2D283E" text-anchor="middle">Pickle No. 5: Cosmic Brine</text>
  </g>
</svg>
