<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="pickleGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1B4332" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="28" fill="url(#bgGrad3)" />

  <!-- Playful elements -->
  <circle cx="90" cy="80" r="16" fill="#FFD166"/>
  <circle cx="330" cy="90" r="12" fill="#FF8DA1" opacity="0.8"/>
  <path d="M 50 290 Q 70 270 90 290 Q 110 310 130 290" fill="none" stroke="#3A86FF" stroke-width="4" stroke-linecap="round"/>
  <circle cx="330" cy="270" r="18" fill="#8338EC" opacity="0.6"/>

  <!-- Pedestal -->
  <ellipse cx="200" cy="325" rx="85" ry="18" fill="#2D283E" opacity="0.12"/>

  <!-- The Cool Pickle -->
  <g filter="url(#shadow3)">
    <!-- Pickle Body -->
    <path d="M 185 85 C 230 85, 245 130, 240 200 C 235 255, 230 295, 185 298 C 145 298, 145 255, 150 200 C 155 135, 145 85, 185 85 Z" 
          fill="url(#pickleGrad3)" stroke="#081C15" stroke-width="4"/>
    
    <!-- Bumps -->
    <ellipse cx="170" cy="120" rx="6" ry="10" fill="#74C69D" transform="rotate(-15 170 120)" />
    <ellipse cx="220" cy="220" rx="7" ry="11" fill="#74C69D" transform="rotate(10 220 220)" />
    <ellipse cx="175" cy="250" rx="6" ry="9" fill="#74C69D" transform="rotate(-5 175 250)" />

    <!-- Cool Sunglasses -->
    <!-- Frame -->
    <path d="M 160 145 L 230 145 L 225 168 C 220 174, 205 174, 200 166 C 195 174, 180 174, 175 168 Z" fill="#2D283E"/>
    <!-- Lenses with cyan reflection -->
    <path d="M 165 149 L 193 149 L 191 163 C 187 168, 170 168, 167 163 Z" fill="#3A86FF"/>
    <path d="M 205 149 L 225 149 L 223 163 C 220 168, 207 168, 205 163 Z" fill="#3A86FF"/>
    <line x1="170" y1="152" x2="185" y2="160" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="210" y1="152" x2="220" y2="158" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Smirk -->
    <path d="M 190 185 Q 200 193 212 184" fill="none" stroke="#081C15" stroke-width="3" stroke-linecap="round"/>

    <!-- Blush under glasses -->
    <circle cx="160" cy="172" r="5" fill="#EF476F" opacity="0.7"/>
    <circle cx="230" cy="172" r="5" fill="#EF476F" opacity="0.7"/>
  </g>

  <!-- Artwork Label Plate -->
  <g transform="translate(90, 345)">
    <rect width="220" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="110" y="21" font-family="'Fraunces', Georgia, serif" font-size="13" font-weight="700" fill="#2D283E" text-anchor="middle">Pickle No. 3: Cool as a Cucumber</text>
  </g>
</svg>
