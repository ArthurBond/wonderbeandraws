<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="pickleGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40916C" />
      <stop offset="100%" stop-color="#1B4332" />
    </linearGradient>
    <filter id="shadow6" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1B4332" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="28" fill="url(#bgGrad6)" />

  <!-- Confetti / Royal sparkles -->
  <rect x="70" y="80" width="12" height="12" rx="3" fill="#EF476F" transform="rotate(25 76 86)"/>
  <rect x="330" y="70" width="10" height="10" rx="2" fill="#8338EC" transform="rotate(-15 335 75)"/>
  <circle cx="65" cy="270" r="10" fill="#3A86FF"/>
  <circle cx="335" cy="280" r="14" fill="#FF8DA1"/>

  <!-- Pedestal -->
  <ellipse cx="200" cy="325" rx="85" ry="18" fill="#2D283E" opacity="0.12"/>

  <!-- Royal Pickle -->
  <g filter="url(#shadow6)">
    <!-- Pickle Body -->
    <path d="M 190 95 C 235 95, 245 135, 240 205 C 235 255, 230 295, 185 298 C 145 298, 145 255, 150 205 C 155 140, 150 95, 190 95 Z" 
          fill="url(#pickleGrad6)" stroke="#081C15" stroke-width="4"/>

    <!-- Shiny Crown -->
    <polygon points="165,95 170,72 185,85 195,68 205,85 220,72 225,95" fill="#FFD166" stroke="#B45309" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Jewels on crown -->
    <circle cx="170" cy="72" r="3" fill="#EF476F"/>
    <circle cx="195" cy="68" r="3.5" fill="#3A86FF"/>
    <circle cx="220" cy="72" r="3" fill="#8338EC"/>

    <!-- Bumps -->
    <ellipse cx="170" cy="130" rx="6" ry="10" fill="#74C69D" transform="rotate(-10 170 130)" />
    <ellipse cx="220" cy="230" rx="7" ry="11" fill="#74C69D" transform="rotate(10 220 230)" />

    <!-- Eyes (Proud & Happy) -->
    <path d="M 174 155 Q 182 148 190 155" fill="none" stroke="#081C15" stroke-width="3" stroke-linecap="round"/>
    <path d="M 204 155 Q 212 148 220 155" fill="none" stroke="#081C15" stroke-width="3" stroke-linecap="round"/>

    <!-- Cheeks -->
    <circle cx="168" cy="162" r="5" fill="#FF8DA1"/>
    <circle cx="224" cy="162" r="5" fill="#FF8DA1"/>

    <!-- Big Happy Smile -->
    <path d="M 188 168 Q 197 182 206 168" fill="#EF476F" stroke="#081C15" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Artwork Label Plate -->
  <g transform="translate(100, 345)">
    <rect width="200" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="100" y="21" font-family="'Fraunces', Georgia, serif" font-size="13" font-weight="700" fill="#2D283E" text-anchor="middle">Pickle No. 6: The Big Dill</text>
  </g>
</svg>
