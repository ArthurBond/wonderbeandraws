<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="100%" stop-color="#FFD166" />
    </linearGradient>
    <linearGradient id="pickleGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#2D6A4F" flood-opacity="0.18"/>
    </filter>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="400" height="400" rx="28" fill="url(#bgGrad1)" />
  
  <!-- Whimsical background dots / sparkles -->
  <circle cx="80" cy="90" r="14" fill="#FF8DA1" opacity="0.6"/>
  <circle cx="330" cy="110" r="8" fill="#8338EC" opacity="0.4"/>
  <circle cx="90" cy="310" r="10" fill="#3A86FF" opacity="0.4"/>
  <circle cx="320" cy="290" r="16" fill="#EF476F" opacity="0.5"/>
  <polygon points="340,60 345,75 360,78 347,88 350,103 337,94 324,103 327,88 314,78 329,75" fill="#FFD166" />

  <!-- Pedestal / Shadow -->
  <ellipse cx="200" cy="325" rx="90" ry="20" fill="#2D283E" opacity="0.12"/>
  
  <!-- The Dill Pickle -->
  <g filter="url(#shadow1)">
    <!-- Pickle Body with gentle curve -->
    <path d="M 180 80 C 235 80, 255 125, 245 200 C 240 250, 235 300, 185 305 C 145 305, 140 260, 150 200 C 158 135, 140 80, 180 80 Z" 
          fill="url(#pickleGrad1)" stroke="#1B4332" stroke-width="4" stroke-linejoin="round"/>
    
    <!-- Pickle bumps/texture -->
    <ellipse cx="170" cy="120" rx="6" ry="10" fill="#74C69D" transform="rotate(-15 170 120)" />
    <ellipse cx="215" cy="140" rx="7" ry="12" fill="#74C69D" transform="rotate(10 215 140)" />
    <ellipse cx="180" cy="180" rx="6" ry="9" fill="#74C69D" transform="rotate(5 180 180)" />
    <ellipse cx="220" cy="225" rx="8" ry="11" fill="#74C69D" transform="rotate(-8 220 225)" />
    <ellipse cx="175" cy="250" rx="7" ry="10" fill="#74C69D" transform="rotate(12 175 250)" />
    
    <!-- Face -->
    <!-- Eyes -->
    <circle cx="185" cy="155" r="5" fill="#1B4332"/>
    <circle cx="212" cy="155" r="5" fill="#1B4332"/>
    <circle cx="183" cy="153" r="1.5" fill="#FFFFFF"/>
    <circle cx="210" cy="153" r="1.5" fill="#FFFFFF"/>
    
    <!-- Rosy Cheeks -->
    <circle cx="175" cy="165" r="5" fill="#FF8DA1"/>
    <circle cx="222" cy="165" r="5" fill="#FF8DA1"/>
    
    <!-- Happy Smile -->
    <path d="M 193 166 Q 199 174 205 166" fill="none" stroke="#1B4332" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Tiny artistic flower on top -->
    <circle cx="175" cy="74" r="5" fill="#FF8DA1"/>
    <circle cx="184" cy="71" r="5" fill="#FFD166"/>
    <circle cx="180" cy="77" r="3" fill="#EF476F"/>
  </g>
  
  <!-- Artwork Label Plate -->
  <g transform="translate(110, 345)">
    <rect width="180" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="90" y="21" font-family="'Fraunces', Georgia, serif" font-size="13" font-weight="700" fill="#2D283E" text-anchor="middle">Pickle No. 1: Dill With It</text>
  </g>
</svg>
