<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#FBCFE8" />
    </linearGradient>
    <linearGradient id="pickleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74C69D" />
      <stop offset="100%" stop-color="#40916C" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#40916C" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="28" fill="url(#bgGrad2)" />

  <!-- Splashes of paint in the 6 requested colors -->
  <path d="M 60 70 C 80 50, 100 80, 85 95 C 70 110, 50 90, 60 70 Z" fill="#FFD166" opacity="0.8"/>
  <circle cx="340" cy="80" r="15" fill="#3A86FF" opacity="0.7"/>
  <path d="M 310 280 C 330 260, 360 270, 345 300 C 330 320, 290 300, 310 280 Z" fill="#8338EC" opacity="0.6"/>
  <circle cx="75" cy="270" r="18" fill="#EF476F" opacity="0.7"/>

  <!-- Pedestal -->
  <ellipse cx="200" cy="325" rx="85" ry="18" fill="#2D283E" opacity="0.12"/>

  <!-- Pickle with Beret & Palette -->
  <g filter="url(#shadow2)">
    <!-- Pickle Body -->
    <path d="M 195 90 C 235 90, 248 135, 240 205 C 235 255, 230 295, 190 298 C 155 298, 150 255, 158 205 C 165 145, 160 90, 195 90 Z" 
          fill="url(#pickleGrad2)" stroke="#1B4332" stroke-width="4"/>
    
    <!-- Bumps -->
    <ellipse cx="178" cy="130" rx="5" ry="9" fill="#95D5B2" transform="rotate(-10 178 130)" />
    <ellipse cx="220" cy="160" rx="6" ry="10" fill="#95D5B2" transform="rotate(15 220 160)" />
    <ellipse cx="185" cy="220" rx="6" ry="8" fill="#95D5B2" transform="rotate(5 185 220)" />

    <!-- Beret on Pickle -->
    <path d="M 165 92 C 160 68, 225 65, 235 88 C 240 98, 160 102, 165 92 Z" fill="#8338EC"/>
    <circle cx="200" cy="65" r="3" fill="#8338EC"/>

    <!-- Eyes (Pensive Artist) -->
    <circle cx="185" cy="140" r="5" fill="#1B4332"/>
    <circle cx="212" cy="140" r="5" fill="#1B4332"/>
    <circle cx="183" cy="138" r="1.5" fill="#FFFFFF"/>
    <circle cx="210" cy="138" r="1.5" fill="#FFFFFF"/>
    
    <!-- Blush -->
    <circle cx="174" cy="148" r="5" fill="#FF8DA1"/>
    <circle cx="223" cy="148" r="5" fill="#FF8DA1"/>

    <!-- Tiny smile -->
    <path d="M 194 150 Q 199 156 204 150" fill="none" stroke="#1B4332" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Little hand holding paintbrush -->
    <path d="M 235 210 Q 255 200 270 190" fill="none" stroke="#2D6A4F" stroke-width="4" stroke-linecap="round"/>
    <!-- Brush handle & bristles with red paint -->
    <line x1="260" y1="205" x2="285" y2="175" stroke="#D4A373" stroke-width="3" stroke-linecap="round"/>
    <path d="M 283 177 L 292 165 C 295 168, 292 173, 287 180 Z" fill="#EF476F"/>

    <!-- Little artist palette on other side -->
    <path d="M 140 215 C 130 195, 110 215, 120 235 C 130 250, 155 240, 150 220 Z" fill="#F4A261" stroke="#2D283E" stroke-width="2"/>
    <circle cx="126" cy="214" r="3" fill="#EF476F"/>
    <circle cx="138" cy="216" r="3" fill="#FFD166"/>
    <circle cx="132" cy="228" r="3" fill="#3A86FF"/>
  </g>

  <!-- Artwork Label Plate -->
  <g transform="translate(100, 345)">
    <rect width="200" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="100" y="21" font-family="'Fraunces', Georgia, serif" font-size="13" font-weight="700" fill="#2D283E" text-anchor="middle">Pickle No. 2: The Artiste</text>
  </g>
</svg>
